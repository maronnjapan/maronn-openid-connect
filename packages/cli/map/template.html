<title>OIDC Provider Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a three-column tool. Left: how the provider is configured (framework, features, endpoints).
     Middle: the steps of one endpoint as the boxes of `maronn-oidc graph`. Right: what is selected,
     down to the functions of core. On a phone the columns stack. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-2: #e9edf2;
    --fg: #182230;
    --muted: #5d6b7b;
    --line: #d5dce5;
    --accent: #0b6e86;
    --accent-fg: #ffffff;
    --select: #dff1f5;
    --k-parse: #4f46e5; --k-resolve: #0891b2; --k-validate: #ea580c; --k-decide: #ca8a04; --k-dispatch: #7c3aed;
    --k-issue: #16a34a; --k-persist: #0f766e; --k-transform: #c026d3; --k-respond: #475569; --k-other: #7a8794;
    --font-ui: "IBM Plex Sans", "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-code: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a; --surface: #161d26; --surface-2: #1f2832; --fg: #e4ebf2; --muted: #93a2b2; --line: #2b3542;
      --accent: #45b6c8; --accent-fg: #0b1a1f; --select: #163640;
      --k-parse: #8d87f5; --k-resolve: #38bdf8; --k-validate: #fb923c; --k-decide: #facc15; --k-dispatch: #a78bfa;
      --k-issue: #4ade80; --k-persist: #2dd4bf; --k-transform: #e879f9; --k-respond: #a5b4c3; --k-other: #8a97a6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141a; --surface: #161d26; --surface-2: #1f2832; --fg: #e4ebf2; --muted: #93a2b2; --line: #2b3542;
    --accent: #45b6c8; --accent-fg: #0b1a1f; --select: #163640;
    --k-parse: #8d87f5; --k-resolve: #38bdf8; --k-validate: #fb923c; --k-decide: #facc15; --k-dispatch: #a78bfa;
    --k-issue: #4ade80; --k-persist: #2dd4bf; --k-transform: #e879f9; --k-respond: #a5b4c3; --k-other: #8a97a6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
  code, .mono { font-family: var(--font-code); font-size: 0.93em; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  .wrap {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 24px;
    max-width: 1600px; margin: 0 auto;
  }
  header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header.top .sub { color: var(--muted); }
  .search { margin-left: auto; position: relative; min-width: 0; flex: 1 1 220px; max-width: 420px; }
  .search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--fg); font: inherit; }
  .search ul { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0,0,0,0.12); max-height: 50vh; overflow: auto; }
  .search li button { display: flex; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border: 0; background: none; border-radius: 4px; cursor: pointer; align-items: baseline; }
  .search li button:hover, .search li button:focus-visible { background: var(--select); outline: none; }
  .search .what { color: var(--muted); font-size: 12px; min-width: 56px; }
  .cols { display: grid; grid-template-columns: 300px minmax(300px, 1fr) minmax(360px, 1.3fr); gap: 16px; margin-top: 14px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 280px minmax(0, 1fr); } .cols > .detail { grid-column: 1 / -1; } }
  @media (max-width: 720px) { .cols { grid-template-columns: minmax(0, 1fr); } .cols > * { grid-column: auto; } }
  .cols > * { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; padding: 10px 12px 6px; font-weight: 600; }
  .panel .body { padding: 4px 12px 12px; }
  .nav .group + .group { border-top: 1px solid var(--line); }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .features { display: flex; flex-direction: column; gap: 2px; }
  .features label { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 2px 0; cursor: pointer; }
  .features label .tier { font-size: 11px; color: var(--muted); }
  .cmd { margin-top: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: var(--radius); overflow-x: auto; white-space: pre; font-size: 12px; }
  .endpoints { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .endpoints li button { display: grid; grid-template-columns: 1fr auto; gap: 6px; width: 100%; text-align: left; padding: 6px 8px; border: 0; background: none; border-radius: 4px; cursor: pointer; }
  .endpoints li button:hover { background: var(--surface-2); }
  .endpoints li button[aria-current="true"] { background: var(--select); }
  .endpoints .route { color: var(--muted); font-size: 12px; }
  .endpoints .grp { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 10px 8px 2px; }
  .flow .body { overflow-x: auto; }
  .flow svg { display: block; font-family: var(--font-ui); }
  .flow .box { cursor: pointer; }
  .flow .box rect { stroke-width: 1.5; }
  .flow .box text { fill: var(--fg); font-size: 12px; pointer-events: none; }
  .flow .box .fn { fill: var(--muted); font-family: var(--font-code); font-size: 11px; }
  .flow .box.selected rect { stroke-width: 3; }
  .flow .edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
  .flow .edge.error { stroke-dasharray: 4 4; opacity: 0.6; }
  .flow .edge-label { fill: var(--muted); font-size: 10px; }
  .flow .arrow { fill: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 0 12px 10px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--k); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 0 12px 6px; font-size: 12px; color: var(--muted); }
  .detail .body { display: flex; flex-direction: column; gap: 14px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--muted); }
  .crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .card h3 code { font-size: 1em; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  .chip.kind { color: var(--accent-fg); border-color: transparent; background: var(--k); font-weight: 500; }
  .chip.pkg { font-family: var(--font-code); white-space: normal; overflow-wrap: anywhere; }
  .chip.dyn { font-style: italic; }
  .marker { font-family: var(--font-code); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .summary { margin: 0; }
  .desc { margin: 0; color: var(--muted); white-space: pre-wrap; }
  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul { margin-left: 14px; padding-left: 10px; border-left: 1px solid var(--line); }
  .tree li { margin: 4px 0; }
  .node { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; }
  .node .toggle { width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); cursor: pointer; padding: 0; line-height: 1; font-size: 12px; }
  .node .toggle[disabled] { opacity: 0.3; cursor: default; }
  .node .head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; }
  .node .name { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-family: var(--font-code); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
  .node .where { color: var(--muted); font-size: 12px; font-family: var(--font-code); word-break: break-all; }
  .node .text { grid-column: 2; color: var(--fg); font-size: 13px; }
  .node .meta { grid-column: 2; }
  .node .text.muted { color: var(--muted); }
  .uses { display: flex; flex-direction: column; gap: 4px; }
  .uses button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
  .uses button:hover { background: var(--select); }
  .empty { color: var(--muted); padding: 24px 12px; }
  .note { color: var(--muted); font-size: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .flow .box rect { transition: stroke-width 120ms; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>OIDC Provider Map</h1>
    <span class="sub" id="sub">What <code>maronn-oidc generate</code> produces: endpoints, their steps, and the functions down to core.</span>
    <div class="search">
      <input id="search" type="search" placeholder="Search a step or a function…" autocomplete="off" aria-label="Search a step or a function">
      <ul id="search-results" hidden></ul>
    </div>
  </header>

  <div class="cols">
    <section class="panel nav" aria-label="Configuration">
      <div class="group">
        <h2>Framework</h2>
        <div class="body"><div class="seg" id="frameworks"></div></div>
      </div>
      <div class="group">
        <h2>Features</h2>
        <div class="body">
          <div class="features" id="features"></div>
          <div class="cmd mono" id="command"></div>
        </div>
      </div>
      <div class="group">
        <h2>Endpoints</h2>
        <div class="body"><ul class="endpoints" id="endpoints"></ul></div>
      </div>
    </section>

    <section class="panel flow" aria-label="Steps">
      <h2 id="flow-title">Steps</h2>
      <div class="toolbar">
        <label><input type="checkbox" id="show-errors"> show the arrows into the error step</label>
        <span id="flow-module"></span>
      </div>
      <div class="body" id="flow"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel detail" aria-label="Detail">
      <h2 id="detail-title">Detail</h2>
      <div class="body" id="detail"><div class="empty">Pick an endpoint, then a step, to see the functions it calls.</div></div>
    </section>
  </div>
</div>

<script id="map-data" type="application/json">__MAP_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('map-data').textContent);
  const KINDS = ['parse', 'resolve', 'validate', 'decide', 'dispatch', 'issue', 'persist', 'transform', 'respond'];
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, children = []) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (value !== undefined && value !== null) node.setAttribute(key, value);
    }
    for (const child of [].concat(children)) if (child !== null && child !== undefined) node.append(child);
    return node;
  };
  const featureKey = (id) => id.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  const featureById = new Map(DATA.features.map((f) => [f.id, f]));
  const featureOfKey = (key) => DATA.features.find((f) => featureKey(f.id) === key || f.id === key);

  const state = {
    framework: DATA.frameworks[0],
    enabled: new Set(DATA.features.filter((f) => f.enabled || f.tier === 'stable').map((f) => f.id)),
    endpoint: null,
    step: null,
    fn: null,
    showErrors: false,
  };
  try { const saved = localStorage.getItem('oidc-map-features'); if (saved) state.enabled = new Set(JSON.parse(saved)); } catch (e) { /* no storage */ }

  const flowOf = () => DATA.flows[state.framework];
  const isOn = (feature) => feature === undefined || feature === null || (featureOfKey(feature) ? state.enabled.has(featureOfKey(feature).id) : true);
  const visibleEndpoints = () => flowOf().endpoints.filter((e) => isOn(e.feature)).map((e) => ({ ...e, steps: e.steps.filter((s) => isOn(s.feature)) }));
  const card = (id) => DATA.functions[id];
  const flagOf = (feature) => { const f = featureOfKey(feature); return f ? f.flag : feature ? `feature: ${feature}` : 'every provider'; };

  // ---- hash routing: #<framework>--<endpoint>[--<step>] | #fn--<name>
  function writeHash() {
    let hash = '';
    if (state.fn) hash = `fn--${card(state.fn) ? card(state.fn).name : ''}`;
    else if (state.endpoint) hash = `${state.framework}--${state.endpoint}${state.step ? `--${state.step}` : ''}`;
    if (hash && location.hash !== `#${hash}`) history.replaceState(null, '', `#${hash}`);
  }
  function readHash() {
    const parts = location.hash.replace(/^#/, '').split('--');
    if (parts[0] === 'fn' && parts[1]) {
      const found = Object.values(DATA.functions).filter((c) => c.name === parts[1]);
      if (found.length > 0) { state.fn = found[0].id; return; }
    }
    if (DATA.frameworks.includes(parts[0])) {
      state.framework = parts[0];
      if (parts[1] && flowOf().endpoints.some((e) => e.id === parts[1])) {
        state.endpoint = parts[1];
        const endpoint = flowOf().endpoints.find((e) => e.id === parts[1]);
        if (parts[2] && endpoint.steps.some((s) => s.id === parts[2])) state.step = parts[2];
      }
    }
  }

  // ---- navigation
  function renderFrameworks() {
    const box = $('frameworks'); box.replaceChildren();
    for (const name of DATA.frameworks) {
      box.append(el('button', { type: 'button', 'aria-pressed': String(name === state.framework), text: name, onclick: () => { state.framework = name; state.fn = null; render(); } }));
    }
  }
  function commandLine() {
    const parts = [`maronn-oidc generate ${state.framework}`];
    const enable = DATA.features.filter((f) => f.tier !== 'stable' && state.enabled.has(f.id)).map((f) => f.id);
    const disable = DATA.features.filter((f) => f.tier === 'stable' && !state.enabled.has(f.id)).map((f) => f.id);
    if (enable.length) parts.push(`--enable ${enable.join(',')}`);
    if (disable.length) parts.push(`--disable ${disable.join(',')}`);
    return parts.join(' \\\n  ');
  }
  function renderFeatures() {
    const box = $('features'); box.replaceChildren();
    for (const feature of DATA.features) {
      const input = el('input', { type: 'checkbox', id: `feature-${feature.id}` });
      input.checked = state.enabled.has(feature.id);
      input.addEventListener('change', () => {
        if (input.checked) state.enabled.add(feature.id); else state.enabled.delete(feature.id);
        try { localStorage.setItem('oidc-map-features', JSON.stringify([...state.enabled])); } catch (e) { /* no storage */ }
        render();
      });
      box.append(el('label', { title: feature.summary }, [input, el('span', { text: feature.id }), el('span', { class: 'tier', text: feature.tier })]));
    }
    $('command').textContent = commandLine();
  }
  function renderEndpoints() {
    const list = $('endpoints'); list.replaceChildren();
    let group = null;
    for (const endpoint of visibleEndpoints()) {
      if (endpoint.group.id !== group) { group = endpoint.group.id; list.append(el('li', { class: 'grp', text: endpoint.group.label })); }
      list.append(el('li', {}, el('button', { type: 'button', 'aria-current': String(endpoint.id === state.endpoint), onclick: () => { state.endpoint = endpoint.id; state.step = null; state.fn = null; render(); } }, [
        el('span', {}, [el('strong', { text: endpoint.label }), el('br'), el('span', { class: 'route mono', text: `${endpoint.methods.join('|')} ${endpoint.path}` })]),
        el('span', { class: 'route', text: `${endpoint.steps.length}` }),
      ])));
    }
  }

  // ---- the steps of an endpoint as boxes and arrows
  const BOX_W = 340, BOX_H = 46, GAP = 26, PAD = 20, ARC = 70;
  function renderFlow() {
    const host = $('flow'); host.replaceChildren();
    const endpoint = visibleEndpoints().find((e) => e.id === state.endpoint);
    $('legend').replaceChildren();
    if (!endpoint) { $('flow-title').textContent = 'Steps'; $('flow-module').textContent = ''; host.append(el('div', { class: 'empty', text: 'Pick an endpoint on the left.' })); return; }
    $('flow-title').textContent = `${endpoint.methods.join('|')} ${endpoint.path} · ${endpoint.steps.length} steps${endpoint.rearrangeable ? '' : ' (a screen: fixed order)'}`;
    $('flow-module').textContent = endpoint.module ? `module: ${endpoint.module}` : '';
    const steps = endpoint.steps;
    const index = new Map(steps.map((s, i) => [s.id, i]));
    const drawn = endpoint.edges.filter((e) => (e.kind !== 'error' || state.showErrors) && index.has(e.from) && index.has(e.to));
    const bulgeOf = (e) => 30 + Math.min(90, Math.abs(index.get(e.to) - index.get(e.from)) * 7);
    const rightArcs = drawn.filter((e) => e.kind !== 'error' && index.get(e.to) !== index.get(e.from) + 1);
    const labelWidth = Math.max(0, ...rightArcs.map((e) => (e.label ? e.label.length * 6 + 8 : 0)));
    const rightMargin = Math.max(PAD, ...rightArcs.map((e) => bulgeOf(e) + labelWidth + PAD));
    const width = PAD + ARC + BOX_W + rightMargin, height = PAD * 2 + steps.length * (BOX_H + GAP) - GAP;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`); svg.setAttribute('width', width); svg.setAttribute('role', 'img');
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>';
    svg.append(defs);
    const x0 = PAD + ARC, yOf = (i) => PAD + i * (BOX_H + GAP);
    const svgEl = (tag, attrs) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
    for (const edge of drawn) {
      const a = index.get(edge.from), b = index.get(edge.to);
      const cls = `edge ${edge.kind}`;
      if (edge.kind === 'flow' && b === a + 1) {
        svg.append(svgEl('path', { class: cls, d: `M${x0 + BOX_W / 2},${yOf(a) + BOX_H} L${x0 + BOX_W / 2},${yOf(b)}`, 'marker-end': 'url(#arrow)' }));
        continue;
      }
      const side = edge.kind === 'error' ? -1 : 1;
      const xEdge = side > 0 ? x0 + BOX_W : x0;
      const ya = yOf(a) + BOX_H / 2, yb = yOf(b) + BOX_H / 2;
      const bulge = side * bulgeOf(edge);
      svg.append(svgEl('path', { class: cls, d: `M${xEdge},${ya} C${xEdge + bulge},${ya} ${xEdge + bulge},${yb} ${xEdge},${yb}`, 'marker-end': 'url(#arrow)' }));
      if (edge.label && edge.kind !== 'error') {
        // The apex of the curve sits at 3/4 of the bulge; the label starts just past it.
        const t = svgEl('text', { class: 'edge-label', x: xEdge + bulge * 0.75 + 4, y: (ya + yb) / 2 + 3 });
        t.textContent = edge.label; svg.append(t);
      }
    }
    steps.forEach((step, i) => {
      const g = svgEl('g', { class: `box${step.id === state.step ? ' selected' : ''}`, tabindex: '0', role: 'button', 'aria-label': `${step.id}: ${step.label}` });
      const color = `var(--k-${KINDS.includes(step.kind) ? step.kind : 'other'})`;
      const rect = svgEl('rect', { x: x0, y: yOf(i), width: BOX_W, height: BOX_H, rx: 6, stroke: color, fill: `color-mix(in srgb, ${color} 14%, var(--surface))` });
      const label = svgEl('text', { x: x0 + 10, y: yOf(i) + 18 }); label.textContent = truncate(`${step.label}${step.feature ? `  (${featureOfKey(step.feature)?.id ?? step.feature})` : ''}`, 52);
      const fn = svgEl('text', { class: 'fn', x: x0 + 10, y: yOf(i) + 35 }); fn.textContent = truncate(`[${step.id}] ${step.function}()`, 50);
      const open = () => { state.step = step.id; state.fn = null; render(); };
      g.addEventListener('click', open); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      g.append(rect, label, fn); svg.append(g);
    });
    host.append(svg);
    const used = new Set(steps.map((s) => s.kind));
    for (const kind of KINDS) if (used.has(kind)) $('legend').append(el('span', { style: `--k: var(--k-${kind})`, text: kind }));
  }
  const truncate = (text, n) => (text.length > n ? `${text.slice(0, n - 1)}…` : text);

  // ---- detail: a step, or a function
  function kindChip(kind) { return el('span', { class: 'chip kind', style: `--k: var(--k-${KINDS.includes(kind) ? kind : 'other'})`, text: kind }); }
  function chips(items, cls = 'chip') { return el('div', { class: 'chips' }, items.map((t) => el('span', { class: cls, text: t }))); }
  function openFunction(id) { state.fn = id; render(); $('detail').scrollIntoView({ block: 'nearest' }); }

  function functionNode(id, depth, seen) {
    const c = card(id);
    const li = el('li');
    if (!c) { li.append(el('div', { class: 'node' }, [el('span'), el('span', { class: 'where', text: id })])); return li; }
    const again = seen.has(id); seen.add(id);
    const hasChildren = c.calls.length > 0 && !again;
    const children = el('ul'); children.hidden = true;
    let built = false;
    const toggle = el('button', { class: 'toggle', type: 'button', 'aria-label': 'expand', text: hasChildren ? '+' : '·' });
    if (!hasChildren) toggle.disabled = true;
    const expand = (open) => {
      if (!built) { for (const callee of c.calls) children.append(functionNode(callee, depth + 1, seen)); built = true; }
      children.hidden = !open; toggle.textContent = open ? '−' : '+'; toggle.setAttribute('aria-expanded', String(open));
    };
    toggle.addEventListener('click', () => expand(children.hidden));
    const head = el('div', { class: 'head' }, [
      el('button', { class: 'name', type: 'button', text: `${c.name}()`, onclick: () => openFunction(c.id) }),
      kindChip(c.kind),
      el('span', { class: 'where', text: `${c.package} ${c.module}:${c.line}` }),
      again ? el('span', { class: 'note', text: '(above)' }) : null,
    ]);
    const node = el('div', { class: 'node' }, [toggle, head]);
    if (c.summary) node.append(el('div', { class: 'text', text: c.summary }));
    const meta = [];
    if (c.spec) meta.push(chips(c.spec));
    if (c.throws) meta.push(el('div', { class: 'note', text: `throws: ${c.throws.join(', ')}` }));
    if (meta.length) node.append(el('div', { class: 'meta' }, meta));
    li.append(node, children);
    if (hasChildren && depth < 1) expand(true);
    return li;
  }
  function callTree(ids, dynamic = []) {
    const seen = new Set();
    const ul = el('ul', { class: 'tree' });
    for (const id of ids) ul.append(functionNode(id, 0, seen));
    for (const name of dynamic) {
      ul.append(el('li', {}, el('div', { class: 'node' }, [el('span'), el('div', { class: 'head' }, [el('span', { class: 'chip dyn', text: name }), el('span', { class: 'note', text: 'dynamic: a method of a resolver or a store, or a hook' })])])));
    }
    if (ids.length === 0 && dynamic.length === 0) ul.append(el('li', { class: 'note', text: 'calls no function of the catalog' }));
    return ul;
  }

  function renderStepDetail(endpoint, step) {
    const title = `[${step.id}]${step.feature ? ` (feature: ${featureOfKey(step.feature)?.id ?? step.feature})` : ''} ${step.label}${step.spec ? ` — ${step.spec}` : ''}`;
    const position = endpoint.steps.findIndex((s) => s.id === step.id);
    const before = endpoint.steps[position - 1], after = endpoint.steps[position + 1];
    const c = step.functionId ? card(step.functionId) : null;
    const dl = el('dl', { class: 'kv' }, [
      el('dt', { text: 'endpoint' }), el('dd', {}, el('code', { text: `${endpoint.methods.join('|')} ${endpoint.path}` })),
      el('dt', { text: 'kind' }), el('dd', {}, kindChip(step.kind)),
      el('dt', { text: 'reads' }), el('dd', { text: step.consumes.length ? step.consumes.join(', ') : '—' }),
      el('dt', { text: 'defines' }), el('dd', { text: step.produces.length ? step.produces.join(', ') : '—' }),
      el('dt', { text: 'pipeline' }), el('dd', {}, el('code', { text: `${before ? `[${before.id}]` : '(first)'} → [${step.id}] → ${after ? `[${after.id}]` : '(last)'}` })),
      el('dt', { text: 'module' }), el('dd', {}, el('code', { text: step.module ?? '—' })),
      el('dt', { text: 'generated' }), el('dd', { text: `${flagOf(step.feature ?? endpoint.feature)}${step.removable ? ' · removable with --flow' : ''}` }),
    ]);
    const fnCard = el('div', { class: 'card' }, c
      ? [
          el('h3', {}, el('code', { text: `${c.name}()` })),
          el('div', { class: 'chips' }, [kindChip(c.kind), el('span', { class: 'chip pkg', text: `${c.package} ${c.module}:${c.line}` })]),
          c.summary ? el('p', { class: 'summary', text: c.summary }) : null,
          c.description ? el('p', { class: 'desc', text: c.description }) : null,
          c.spec ? chips(c.spec) : null,
          c.throws ? el('div', { class: 'note', text: `throws: ${c.throws.join(', ')}` }) : null,
          el('div', {}, el('button', { class: 'name', type: 'button', text: 'where else is this function used?', onclick: () => openFunction(c.id) })),
        ]
      : [
          el('h3', {}, el('code', { text: `${step.function}()` })),
          el('p', { class: 'summary muted', text: `A block of ${step.module ?? 'the Route Handler'} in the Next.js output: the marker line opens it, the next marker closes it.` }),
        ]);
    $('detail-title').textContent = 'Step';
    $('detail').replaceChildren(
      el('div', { class: 'crumbs' }, [el('button', { type: 'button', text: endpoint.id, onclick: () => { state.step = null; render(); } }), el('span', { text: '›' }), el('span', { text: step.id })]),
      el('div', { class: 'marker', text: `// ${title}` }),
      dl,
      fnCard,
      el('div', {}, [el('h2', { text: 'Calls, down to core' }), callTree(step.calls, step.dynamicCalls ?? [])]),
    );
  }

  function usesOf(id) {
    const found = [];
    for (const endpoint of flowOf().endpoints) for (const step of endpoint.steps) {
      if (step.functionId === id) found.push({ endpoint, step, as: 'function' });
      else if (step.calls.includes(id)) found.push({ endpoint, step, as: 'call' });
    }
    return found;
  }
  function callerTree(id, depth, seen) {
    const c = card(id); const ul = el('ul', { class: 'tree' });
    if (!c) return ul;
    for (const callerId of c.calledBy) {
      const caller = card(callerId);
      const li = el('li');
      if (!caller) { li.append(el('div', { class: 'node' }, [el('span'), el('span', { class: 'where', text: callerId })])); ul.append(li); continue; }
      const again = seen.has(callerId); seen.add(callerId);
      const uses = usesOf(callerId);
      const head = el('div', { class: 'head' }, [
        el('span', { class: 'note', text: '←' }),
        el('button', { class: 'name', type: 'button', text: `${caller.name}()`, onclick: () => openFunction(caller.id) }),
        kindChip(caller.kind),
        el('span', { class: 'where', text: `${caller.package} ${caller.module}:${caller.line}` }),
        again ? el('span', { class: 'note', text: '(above)' }) : null,
      ]);
      const node = el('div', { class: 'node' }, [el('span'), head]);
      for (const use of uses) node.append(el('div', { class: 'text muted' }, [el('span', { text: `⇐ ${use.as === 'function' ? 'the function of' : 'called by'} step ` }), el('button', { class: 'name', type: 'button', text: `[${use.step.id}] of ${use.endpoint.methods.join('|')} ${use.endpoint.path}`, onclick: () => { state.fn = null; state.endpoint = use.endpoint.id; state.step = use.step.id; render(); } }), el('span', { text: `  (${flagOf(use.step.feature ?? use.endpoint.feature)})` })]));
      li.append(node);
      const isStep = uses.some((u) => u.as === 'function');
      if (!again && !isStep && depth < 6) li.append(callerTree(callerId, depth + 1, seen));
      ul.append(li);
    }
    return ul;
  }
  function renderFunctionDetail(id) {
    const c = card(id);
    const uses = usesOf(id);
    $('detail-title').textContent = 'Function';
    $('detail').replaceChildren(
      el('div', { class: 'crumbs' }, [state.endpoint ? el('button', { type: 'button', text: `back to ${state.endpoint}${state.step ? `/${state.step}` : ''}`, onclick: () => { state.fn = null; render(); } }) : null]),
      el('div', { class: 'card' }, [
        el('h3', {}, el('code', { text: `${c.name}()` })),
        el('div', { class: 'chips' }, [kindChip(c.kind), el('span', { class: 'chip pkg', text: `${c.package} ${c.module}:${c.line}` }), el('span', { class: 'chip', text: c.exported ? 'exported' : 'not exported' })]),
        c.summary ? el('p', { class: 'summary', text: c.summary }) : el('p', { class: 'summary muted', text: 'No JSDoc above this function.' }),
        c.description ? el('p', { class: 'desc', text: c.description }) : null,
        c.spec ? chips(c.spec) : null,
        c.throws ? el('div', { class: 'note', text: `throws: ${c.throws.join(', ')}` }) : null,
      ]),
      el('div', {}, [el('h2', { text: `Used by steps of ${state.framework}` }), uses.length ? el('div', { class: 'uses' }, uses.map((use) => el('button', { type: 'button', onclick: () => { state.fn = null; state.endpoint = use.endpoint.id; state.step = use.step.id; render(); } }, [
        el('strong', { text: `[${use.step.id}]` }), el('span', { text: ` ${use.as === 'function' ? 'is this function' : 'calls it'} · ${use.endpoint.methods.join('|')} ${use.endpoint.path}` }), el('br'), el('span', { class: 'note', text: `${flagOf(use.step.feature ?? use.endpoint.feature)}${use.step.module ? ` · ${use.step.module}` : ''}` }),
      ]))) : el('p', { class: 'note', text: 'No step of this framework calls it directly; see the callers below.' })]),
      el('div', {}, [el('h2', { text: 'Calls' }), callTree(c.calls)]),
      el('div', {}, [el('h2', { text: 'Called by' }), c.calledBy.length ? callerTree(c.id, 0, new Set()) : el('p', { class: 'note', text: 'No function of the catalog calls it: an entry point, or reached through a resolver, a store or a hook.' })]),
    );
  }
  function renderDetail() {
    if (state.fn && card(state.fn)) { renderFunctionDetail(state.fn); return; }
    state.fn = null;
    const endpoint = visibleEndpoints().find((e) => e.id === state.endpoint);
    const step = endpoint && endpoint.steps.find((s) => s.id === state.step);
    if (endpoint && step) { renderStepDetail(endpoint, step); return; }
    $('detail-title').textContent = 'Detail';
    if (endpoint) {
      $('detail').replaceChildren(
        el('div', { class: 'card' }, [
          el('h3', { text: endpoint.label }),
          el('div', { class: 'chips' }, [el('span', { class: 'chip pkg', text: `${endpoint.methods.join('|')} ${endpoint.path}` }), el('span', { class: 'chip', text: endpoint.layer }), endpoint.spec ? el('span', { class: 'chip', text: endpoint.spec }) : null]),
          el('p', { class: 'summary', text: `${endpoint.steps.length} steps, ${endpoint.rearrangeable ? 'a pipeline --flow can reorder' : 'a screen with a fixed order'}. ${flagOf(endpoint.feature)}.` }),
          endpoint.module ? el('div', { class: 'note', text: `module: ${endpoint.module}` }) : null,
        ]),
        el('p', { class: 'note', text: 'Click a step box to see its function and what it calls, down to core.' }),
      );
    } else {
      $('detail').replaceChildren(el('div', { class: 'empty', text: 'Pick an endpoint, then a step, to see the functions it calls.' }));
    }
  }

  // ---- search
  function renderSearch(query) {
    const list = $('search-results'); list.replaceChildren();
    const q = query.trim().toLowerCase();
    if (q.length < 2) { list.hidden = true; return; }
    const hits = [];
    for (const endpoint of visibleEndpoints()) for (const step of endpoint.steps) {
      if (step.id.includes(q) || step.label.toLowerCase().includes(q) || step.function.toLowerCase().includes(q)) hits.push({ what: 'step', text: `[${step.id}] ${step.label}`, sub: `${endpoint.methods.join('|')} ${endpoint.path}`, go: () => { state.fn = null; state.endpoint = endpoint.id; state.step = step.id; } });
    }
    for (const c of Object.values(DATA.functions)) {
      if (c.name.toLowerCase().includes(q)) hits.push({ what: c.package, text: `${c.name}()`, sub: c.module, go: () => { state.fn = c.id; } });
    }
    for (const hit of hits.slice(0, 40)) {
      list.append(el('li', {}, el('button', { type: 'button', onclick: () => { hit.go(); list.hidden = true; $('search').value = ''; render(); } }, [el('span', { class: 'what', text: hit.what }), el('span', { class: 'mono', text: hit.text }), el('span', { class: 'what', text: hit.sub })])));
    }
    if (hits.length === 0) list.append(el('li', { class: 'note', text: 'nothing matches' }));
    list.hidden = false;
  }
  $('search').addEventListener('input', (e) => renderSearch(e.target.value));
  $('search').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('search-results').hidden = true; } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('search-results').hidden = true; });
  $('show-errors').addEventListener('change', (e) => { state.showErrors = e.target.checked; renderFlow(); });

  function render() {
    if (state.endpoint && !flowOf().endpoints.some((e) => e.id === state.endpoint && isOn(e.feature))) { state.endpoint = null; state.step = null; }
    renderFrameworks(); renderFeatures(); renderEndpoints(); renderFlow(); renderDetail(); writeHash();
  }
  readHash();
  if (!state.endpoint && !state.fn) state.endpoint = flowOf().endpoints.find((e) => e.id === 'token') ? 'token' : flowOf().endpoints[0]?.id ?? null;
  render();
  window.addEventListener('hashchange', () => { state.fn = null; state.endpoint = null; state.step = null; readHash(); render(); });
})();
</script>
