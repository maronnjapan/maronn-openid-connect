# OIDC Provider Map のプレビューの後片付け
#
# 地図（apps/map）のビルド、PR ごとのプレビュー、main の本番へのデプロイ、PR へのコメントは、
# テストの結果と到達を地図に載せるため ci.yml の map ジョブ（test ジョブの後）が行う
# （apps/map/docs/design-test-catalog.md「ワークフロー」）。ここは PR を閉じたときに、その PR の
# Worker Preview `pr-<番号>`（とフォールバックの Worker `maronn-oidc-map-pr-<番号>`）を消し、
# 地図のコメントを書き換えるだけである（.github/scripts/map-preview.mjs）。
name: Map Preview

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: map-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove the Preview of the pull request
        id: remove
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node .github/scripts/map-preview.mjs delete --pr "${{ github.event.pull_request.number }}"

      - name: Note the removal on the pull request
        uses: actions/github-script@v9
        env:
          NOTE: ${{ steps.remove.outputs.note }}
        with:
          script: |
            const marker = '<!-- oidc-provider-map-preview -->';
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (!existing) return;
            const body = `${marker}\n## OIDC Provider Map\n\nThe preview of this pull request was removed when it was closed (${process.env.NOTE || 'no Cloudflare secrets'}). The map of main is deployed by the push to main.`;
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
