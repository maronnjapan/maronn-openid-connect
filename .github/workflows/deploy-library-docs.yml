name: Deploy Docs

# ドキュメントサイトには、生成される OP の地図（/map/。packages/cli/scripts/build-map.mjs が
# 作る静的ページ）も含める。地図はコードから作るので、docs/ 以外の変更でも main への push で配る。
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Configure GitHub Pages
              id: pages
              uses: actions/configure-pages@v6

            - uses: pnpm/action-setup@v6
              with:
                  version: 10.17.0

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install

            # build:docs は CLI をビルドしてから docs を作る（地図は CLI の dist から作る）。
            - name: Build docs
              env:
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}
              run: pnpm run build:docs

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/library-document/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
