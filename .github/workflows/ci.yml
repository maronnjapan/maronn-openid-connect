# CI ワークフロー
#
# pull_request だけでなく main への push でも起動する。
# PR を経由しない直接 push（親 1 つの通常コミット）が無検査のまま
# release.yml の version / publish 段階へ流れ込む経路を塞ぐため。
#
# ゲートの構成そのもの（push トリガ / build・typecheck の実行順 / typecheck の網羅）は
# `pnpm run test:ci-gate`（.github/scripts/verify-ci-gate.mjs）で検証している。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR と main push で同一ジョブが二重に走るコストを抑える。
# ただし main push の実行は打ち切らない。main が緑であることは
# release の前提であり、後続 push で取り消すと検証結果が残らないため。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # publish 可能なパッケージの出荷物を変えた PR に changeset を必須にする。
  # changeset が無いと Version Packages PR が立たず、変更が publish されないまま
  # main に埋もれるため、PR 時点で止める（詳細は verify-changeset-coverage.mjs）。
  changeset-coverage:
    # Version Packages PR は changeset を消化する側なので対象外。
    # ここを通すと「changeset を消す PR が changeset を要求される」デッドロックになる。
    # Dependabot は packages/*/package.json の devDependencies を更新するだけで
    # 出荷物は変わらない（本リポジトリの dependencies は workspace 内部のみ）。
    if: >-
      !startsWith(github.head_ref, 'changeset-release/')
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # base との差分を取るため全履歴が要る
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 依存インストールは不要（Node 標準 API だけで動く）
      - name: Verify changeset coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD)" \
          ADDED_CHANGESETS="$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- .changeset)" \
          node .github/scripts/verify-changeset-coverage.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity vulnerabilities
        run: pnpm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build は typecheck より前に置く。
      # samples/* と packages/experimental は @maronn-openid-connect/core を workspace 経由の
      # ビルド成果物（dist の .d.ts）として解決するため、未ビルドだと
      # 「Cannot find module '@maronn-openid-connect/core'」で typecheck が落ちる。
      - name: Build packages
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      # TODO: lint ツール自体が未導入のため Lint ステップは追加していない。
      # packages/* のどれも lint スクリプトを持たない状態で `pnpm run lint` を
      # 呼ぶと、対象 0 件のまま成功して「常に緑で何も検証しないステップ」になる。
      # この false green は test:ci-gate が検知する。

      - name: Unit & Integration tests
        run: pnpm run test:ci

      - name: Install Playwright browsers
        run: pnpm --filter @maronn-openid-connect/e2e exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidc-e2e-reports
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
