name: Request PR quiz materials

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: このリポジトリの PR 番号
        required: true
      spec_id:
        description: 対象仕様 ID (例 rfc-6749。空なら PR の変更内容だけを出題)
      focus_paths:
        description: 対象ファイル・ディレクトリ (カンマ区切り。ディレクトリは末尾 /)
      question_count:
        description: 作問する人・ツールへの任意のメモとして保存する問題数
        default: '7'
      question_categories:
        description: 作問メモとして保存するカテゴリ (カンマ区切り)
        default: vocabulary,knowledge,flow,design,debugging,comparison,implementation

permissions:
  contents: read

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: quiz-authoring
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Send PR information for material preparation in readRFCInMobile
        run: node .github/scripts/request-quiz.mjs
        env:
          QUIZ_DISPATCH_TOKEN: ${{ secrets.QUIZ_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SPEC_ID: ${{ inputs.spec_id }}
          FOCUS_PATHS: ${{ inputs.focus_paths }}
          QUESTION_COUNT: ${{ inputs.question_count }}
          QUESTION_CATEGORIES: ${{ inputs.question_categories }}
