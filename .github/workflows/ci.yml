# CI ワークフロー
#
# pull_request だけでなく main への push でも起動する。
# PR を経由しない直接 push（親 1 つの通常コミット）が無検査のまま
# release.yml の version / publish 段階へ流れ込む経路を塞ぐため。
#
# ゲートの構成そのもの（push トリガ / build・typecheck の実行順 / typecheck の網羅）は
# `pnpm run test:ci-gate`（.github/scripts/verify-ci-gate.mjs）で検証している。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR と main push で同一ジョブが二重に走るコストを抑える。
# ただし main push の実行は打ち切らない。main が緑であることは
# release の前提であり、後続 push で取り消すと検証結果が残らないため。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # publish 可能なパッケージの出荷物を変えた PR に changeset を必須にする。
  # changeset が無いと Version Packages PR が立たず、変更が publish されないまま
  # main に埋もれるため、PR 時点で止める（詳細は verify-changeset-coverage.mjs）。
  changeset-coverage:
    # Version Packages PR は changeset を消化する側なので対象外。
    # ここを通すと「changeset を消す PR が changeset を要求される」デッドロックになる。
    # Dependabot は packages/*/package.json の devDependencies を更新するだけで
    # 出荷物は変わらない（本リポジトリの dependencies は workspace 内部のみ）。
    # 例外は packages/google-login の google-auth-library（production 依存）で、
    # その bump を publish するときは担当者が changeset を手で足す（RELEASE.md）。
    if: >-
      !startsWith(github.head_ref, 'changeset-release/')
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # base との差分を取るため全履歴が要る
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 依存インストールは不要（Node 標準 API だけで動く）
      - name: Verify changeset coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD)" \
          ADDED_CHANGESETS="$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- .changeset)" \
          node .github/scripts/verify-changeset-coverage.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 修正版のあるアドバイザリは package.json の pnpm.overrides にセキュリティフロアを足して解消する。
      # 修正版が無いものだけ pnpm.auditConfig.ignoreGhsas で除外し、理由をここに残す。
      # 修正版が出たら除外を消してフロアに置き換えること。
      #
      # - GHSA-ch52-4w7c-c8xp（http-cache-semantics、修正版なし）
      #   docs__library-document>astro 経由。脆弱なのは共有キャッシュがクライアントの max-stale
      #   付きリクエストに応答する経路だが、astro はビルド時にリモート画像の TTL を
      #   storable() / timeToLive() で求めるだけでその経路を通らない。4.3.0 も max-stale の
      #   処理は 4.2.0 と同じなので、バージョンを上げても解消しない。
      - name: Audit high-severity vulnerabilities
        run: pnpm audit --audit-level=high

  # テストの結果（Vitest と Playwright の JSON と JUnit）と、テストごとの到達（MARONN_REACH=1 の計測。
  # Vitest は Istanbul の計数、E2E は OP の V8 の計数の差分）を work/test-reports に書く。
  # 次の map ジョブがそれを地図のテストの欄に載せ、カバレッジと結果は Codecov に上げる
  # （apps/map/docs/design-test-catalog.md「データとビルド」）。計測は CI だけで行い、手元の pnpm test は変わらない。
  test:
    runs-on: ubuntu-latest
    env:
      MARONN_TEST_REPORTS: ${{ github.workspace }}/work/test-reports
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build は typecheck より前に置く。
      # samples/*・packages/experimental・packages/google-login は @maronn-openid-connect/core を workspace 経由の
      # ビルド成果物（dist の .d.ts）として解決するため、未ビルドだと
      # 「Cannot find module '@maronn-openid-connect/core'」で typecheck が落ちる。
      - name: Build packages
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      # apps/* の import 境界（base が features と experimental を import しない、
      # requires の無い features 間 import が無い、所有者付きブロックの参照先）を検査する。
      # CLI はこの境界を前提にファイルを選んでブロックを消すため、破れると生成物が壊れる。
      # 実体は .github/scripts/lint-import-boundaries.mjs。lint が何も検査しない
      # false green は test:ci-gate が検知する。
      - name: Lint
        run: pnpm run lint

      - name: Unit & Integration tests
        env:
          MARONN_REACH: '1'
        run: pnpm run test:ci

      - name: Install Playwright browsers
        run: pnpm --filter @maronn-openid-connect/e2e exec playwright install --with-deps chromium

      # PR ごとの E2E は apps/hono と apps/nextjs（CLI が生成コードを抽出する全機能オンのアプリ）を対象にする。
      # samples の E2E は e2e-samples.yml が nightly と手動起動で回す。
      - name: E2E tests
        env:
          MARONN_REACH: '1'
        run: pnpm run test:e2e

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidc-e2e-reports
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

      # 落ちたテストがあっても、そこまでの結果と到達を地図に載せる。
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: work/test-reports
          if-no-files-found: ignore

      # PR のコメントの patch coverage（変えた行のうちテストが通った割合）と、失敗したテストと flaky なテスト（Test Analytics）。
      # Vitest と E2E は flag で分ける。fork からの PR はトークンが無いので上げない（地図のプレビューと同じ制限）。
      - name: Upload the coverage of Vitest to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          directory: work/test-reports/coverage/vitest
          flags: vitest
          fail_ci_if_error: false

      - name: Upload the coverage of E2E to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          directory: work/test-reports/coverage/e2e
          flags: e2e
          fail_ci_if_error: false

      - name: Upload the test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report_type: test_results
          directory: work/test-reports/junit
          fail_ci_if_error: false

  # OIDC Provider Map（apps/map）を、テストの結果と到達を載せてビルドし、PR ごとのプレビューと main の本番に出す。
  # テストの後に置くのは、地図のテストの欄（テストカタログ、結果、到達、PR のテストの差分）が test ジョブの出力を読むため。
  # テストが落ちても、そこまでの結果で地図を作る（if: !cancelled()）。
  #
  # - PR: その PR のコードから地図をビルドし、同じ Worker の Worker Preview `pr-<番号>` を作る・更新する。
  #   PR の地図は base ブランチと比べてその PR が変えた関数とエンドポイントの処理本体に札を付け、
  #   変更メモ（apps/map/changes/*.md）の意図と、テストの差分（足した、変えた、消したテスト、
  #   関連するテストが変わっていない実装の変更）を並べる。URL と変更の表は PR にコメントする
  #   （push ごとに同じコメントを書き換える）。エンドポイントに届く変更に説明の節が無いとき、
  #   または関連するテストを足しも変えもせず理由（テストを変えない理由:）も無いとき、地図のビルド
  #   （pnpm run build:map の最後の検査）が落ちてこのジョブが失敗する。そのときもページのデプロイと
  #   コメントは行う。Worker Previews が失敗したときは PR ごとの Worker へ wrangler deploy する
  #   （.github/scripts/map-preview.mjs）。PR を閉じたときのプレビューの削除は map-preview.yml が行う。
  # - main への push: wrangler deploy で本番を更新する。
  #
  # どの場合も artifact（oidc-provider-map）にビルド結果を残す。fork からの PR はシークレットが
  # 無いのでデプロイもコメントもせず、artifact だけ残る。
  map:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PR の地図は、このランがビルドするマージコミットと base ブランチの分岐点（git merge-base）を
          # 比べて変わった関数とテストを見つけるので、履歴が要る。
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test ジョブが書いた結果と到達。無ければ（test ジョブが途中で止まった）コードから読めることだけで地図を作る。
      - name: Download the test reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-reports
          path: work/test-reports

      # CLI、解析（packages/map-analysis）、テストカタログ（packages/test-catalog）をビルドし、全関数と
      # エンドポイントの処理を TypeScript のコンパイラで木に読み、テストをテストカタログに読んで、
      # 地図のデータとページを作り、出力を検査する（apps/map/scripts/check-map.mjs）。
      # PR では MAP_BASE に base ブランチを渡し、変更前の木とテストカタログとの差分と変更メモを地図に載せる。
      # 変わった関数とテストの一覧は dist/data/changes.md にも書かれる。説明の無い変更か、関連するテストの
      # 変わっていない変更があると、ページを作ったうえでこのステップが落ちる（後のステップはページがあれば続け、
      # ジョブは失敗のまま）。
      - name: Build the map
        id: build
        env:
          MAP_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          MAP_PR: ${{ github.event.pull_request.number }}
          MAP_PR_TITLE: ${{ github.event.pull_request.title }}
          MAP_PR_URL: ${{ github.event.pull_request.html_url }}
          MAP_TEST_REPORTS: ${{ github.workspace }}/work/test-reports
        run: pnpm run build:map

      - name: Check map types and layout
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: pnpm --filter @maronn-openid-connect/map typecheck && pnpm --filter @maronn-openid-connect/map test

      - name: Upload the map
        if: ${{ !cancelled() && hashFiles('apps/map/dist/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: oidc-provider-map
          path: apps/map/dist
          if-no-files-found: error

      - name: Create or update the Preview of the pull request
        id: preview
        if: ${{ !cancelled() && hashFiles('apps/map/dist/index.html') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.CLOUDFLARE_API_TOKEN != '' }}
        run: node .github/scripts/map-preview.mjs create --pr "${{ github.event.pull_request.number }}" --sha "${{ github.event.pull_request.head.sha }}"

      - name: Deploy main to production
        id: production
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: node .github/scripts/map-preview.mjs deploy

      - name: Comment the Preview on the pull request
        if: ${{ !cancelled() && hashFiles('apps/map/dist/index.html') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_MODE: ${{ steps.preview.outputs.mode }}
          PREVIEW_NOTE: ${{ steps.preview.outputs.note }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- oidc-provider-map-preview -->';
            const url = process.env.PREVIEW_URL;
            const outcome = process.env.PREVIEW_OUTCOME;
            // The functions and the tests the pull request changed and what its change notes say (written by the build).
            const changesFile = 'apps/map/dist/data/changes.md';
            const changes = fs.existsSync(changesFile) ? fs.readFileSync(changesFile, 'utf8').trim() : '';
            const how = process.env.PREVIEW_MODE === 'worker'
              ? 'a Worker of this pull request (Worker Previews failed; see the run)'
              : 'a Worker Preview of this pull request: the same URL follows every push, and it is removed when the pull request is closed';
            const status = url
              ? `Preview: ${url}\n\n(${how})`
              : outcome === 'skipped'
                ? 'Preview: not deployed (no Cloudflare secrets for this run). Download the `oidc-provider-map` artifact of the run below and serve `dist/` statically.'
                : `Preview: the deploy failed; see the run below. (${process.env.PREVIEW_NOTE || ''})`;
            // The build fails after writing the page when a change that reaches an endpoint has no note, or changes no related test without a reason.
            const failed = process.env.BUILD_OUTCOME === 'failure'
              ? ['', '> [!WARNING]', '> 地図のビルドの検査が落ちました。下の「説明の無い変更」に変更メモの節を足すか、「テスト」の節の「関連するテストに変更の無い実装の変更」にテストを足すか変更メモに `テストを変えない理由:` を書くか、検査の出力を Run で確かめてください（`pnpm --filter @maronn-openid-connect/map changes:draft` で雛形を作れます）。']
              : [];
            const codecov = `${context.serverUrl.replace('github.com', 'app.codecov.io/gh')}/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}`;
            // The changes come first (they open with 説明の無い変更), then the preview, the run and what the map is.
            const body = [
              marker,
              '## OIDC Provider Map',
              ...failed,
              ...(changes ? ['', changes] : []),
              '',
              status,
              ...(url && changes ? ['', `このPRの変更（説明の無い変更、変わった関数の差分と変更メモ、届く経路、テストの差分）: ${url}#changes`] : []),
              ...(url ? [`テストの一覧（エンドポイントごとのテスト、不足）: ${url}#tests`] : []),
              `テストの結果とカバレッジ（Codecov）: ${codecov}`,
              '',
              `Run: ${process.env.RUN_URL} (artifact \`oidc-provider-map\`)`,
              '',
              `Built from ${process.env.HEAD_SHA}. The map shows the endpoints, steps and functions of every framework with every feature on as traces you open call by call; the feature toggles narrow it to one \`maronn-oidc generate\` command line. The functions and endpoint bodies this pull request changes carry a badge, with what changed (the diff of their flow), the endpoints it reaches, what its change notes (\`apps/map/changes/*.md\`) say, and the tests that name or reach them.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
