# Release ワークフロー
#
# Changesets で「Version Packages」PR を作り、その PR がマージされたら npm へ publish する。
#
# 【リリース運用フロー（重要）】
#   このワークフローは「changeset を貯めて、出すときにまとめて公開する」二段階構成。
#   changeset が 1 個でも即 publish されることはない。
#
#   1) 機能 PR で `pnpm changeset` を実行し `.changeset/*.md` を追加して main にマージする。
#   2) main への push ごとに、未消化の changeset を 1 本の「Version Packages」PR に
#      集約し続ける（version 段階）。この時点では publish しない。
#      → changeset を複数貯めても、すべてこの 1 つの PR にまとまり CHANGELOG 案も集約される。
#   3) 「そろそろリリースするか」となったら、その Version Packages PR をマージする。
#      これで changeset が消化されてバージョン確定 → 次の push で publish が走る（publish 段階）。
#
#   つまりリリースのタイミングは「Version Packages PR をいつマージするか」で人間が制御する。
#
# 【@maronn-openid-connect/experimental の自動 publish】
#   experimental だけは changeset を手で書かなくてよい。main への push ごとに
#   `.github/scripts/ensure-experimental-changeset.mjs` を実行し、
#   `packages/experimental/package.json` の version を最後に確定したコミット以降に
#   `packages/experimental/src` の実装が変わっていれば patch の changeset を自動生成する。
#   → 実装が入った時点で Version Packages PR が立ち、それをマージすれば publish される。
#
#   基準を publish 時のタグではなく version 確定コミットに置いているのが要点。タグは publish
#   でしか生まれないのに、publish はこの判定の結果でしか起きないため、タグを基準にすると
#   「毎 push で changeset が再生成され → 常に version 段階 → publish に一生到達しない」
#   という循環に落ちる（詳細は RELEASE.md「なぜ version 確定コミットを基準にするのか」）。
#
#   bump は常に patch 固定。生成する changeset は `auto-experimental-patch.md` の 1 本だけで、
#   実行のたびに未リリースの変更一覧で上書きする。そのため Version Packages PR のマージを
#   忘れて複数の機能がたまっても、CHANGELOG には全部載ったうえで patch 1 回に吸収される
#   （手書きの changeset が minor / major を指定していないかは
#   `pnpm run test:release-contract` が CI で弾く）。
#
#   同スクリプトは changesets/action が「未消化の changeset があるか」を判定する前
#   （下の Ensure ステップ）と、`ci:version` の中の 2 か所で実行する。前者は version 段階へ
#   入るために必要で、後者は action が release ブランチを作り直したあとでも changeset が
#   残ることを保証する。スクリプトは冪等なので 2 回実行しても changeset は 1 本のまま。
#

# publish は npm Trusted Publishing (OIDC) を利用する前提で構成している。
#   - 長期トークン（NPM_TOKEN）は不要。OIDC で短命トークンを都度取得する。
#   - provenance（来歴証明）は trusted publishing 利用時に自動付与される。
#   - OIDC トークン取得には `permissions.id-token: write` が必須。
#   - publish 実体は pnpm が担う。pnpm 10.17+ が OIDC trusted publishing に対応している
#     （本リポジトリは packageManager で pnpm@10.17.0 を固定）。
#
# 【publish 前に npmjs.com 側で必要な設定】
#   publish 対象の各パッケージ（@maronn-openid-connect/core, @maronn-openid-connect/cli,
#   @maronn-openid-connect/experimental, @maronn-openid-connect/google-login）の
#   npm ページ → Settings → Trusted Publisher で、以下を登録する。
#   1 つでも未登録だと OIDC でトークンを取れず、そのパッケージの publish が認証エラーで落ちる:
#     - Provider: GitHub Actions
#     - Repository: maronnjapan/maronn-openid-connect
#     - Workflow filename: release.yml
#     - Environment: 空欄（このワークフローは environment: を使っていないため、
#       Environment 付きで登録すると OIDC の claim が一致せず publish できない）
#
# 【初回 publish の注意（chicken-and-egg）】
#   パッケージ単位の Trusted Publisher 設定は「パッケージが既に存在すること」が前提。
#   そのため各パッケージの最初の 1 回だけは、ローカルから手動 publish するか、
#   organization 単位の Trusted Publisher 設定を使う必要がある。
#   2 回目以降は本ワークフローの OIDC publish だけで完結する。
#
# 【changesets/action と @changesets/cli は major を揃える】
#   changesets/action は changeset publish が何を publish したかを CLI の出力から読み取り、
#   それをもとにタグの push・GitHub Release の作成・published / published-packages 出力を行う。
#   読み取り方は major ごとに違う。CLI v2 と組む action v1 は stdout の `New tag:` 行を拾い、
#   CLI v3 と組む action v2 は環境変数 CHANGESETS_OUTPUT のファイルに CLI が書く git-tag イベントを読む
#   （CLI v3 は `New tag:` 行を出さない）。
#   組み合わせを外すと publish は成功したまま action が「何も publish されなかった」と判断し、
#   タグ・Release・provenance 検証が黙って止まる。2026-09-03 に CLI だけが 3 系へ上がってから
#   7 週間この状態だった（RELEASE.md「@changesets/cli と changesets/action は major を揃えて上げる」）。
#   組み合わせは `pnpm run test:release-contract` が CI で検査する。

name: Release

on:
    push:
        branches: [main]

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# デフォルトを最小権限にし、必要な job だけ昇格する
permissions: {}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Version Packages PR の作成・タグ push に必要
            pull-requests: write # Version Packages PR の作成に必要
            id-token: write # npm Trusted Publishing (OIDC) のトークン取得に必須
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # experimental の自動 changeset は、packages/experimental/package.json の
                  # version を最後に確定したコミットと HEAD の差分で変更を判定する。
                  # shallow clone だとその履歴を辿れないため全履歴を取得する。
                  fetch-depth: 0

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: "pnpm"
                  registry-url: "https://registry.npmjs.org"

            - name: Update npm to a pinned stable version
              run: npm install -g npm@11.17.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # changesets/action は「未消化の changeset があるか」で version 段階か publish 段階かを
            # 決める。experimental の自動 changeset は action より前に置く必要がある。
            - name: Ensure experimental release changeset
              run: pnpm run ci:ensure-experimental-changeset

            - name: Create Release PR or Publish to npm
              id: changesets
              # @changesets/cli 3 系と組む major（冒頭の【changesets/action と @changesets/cli は major を揃える】）。
              # 入出力名は v2 で kebab-case に改名されている（version → version-script、
              # publishedPackages → published-packages、hasChangesets → has-changesets など）。
              uses: changesets/action@v2
              with:
                  # 未消化の changeset があれば Version Packages PR を作成/更新する。
                  version-script: pnpm run ci:version
                  # その PR がマージされ changeset が無くなった push で publish する。
                  # ci:publish は build 後に `changeset publish`（実体は pnpm publish）を実行する。
                  # action が渡す CHANGESETS_OUTPUT は pnpm run の環境をそのまま通って changeset publish に届く。
                  # ci:publish を書き換えるときもこの環境変数を落とさないこと。落とすと action は publish を検出できない。
                  publish-script: pnpm run ci:publish
                  # v2 の既定は GitHub API での push だが、v1 と同じ git CLI での push を続ける。
                  # 変えるのは publish の検出方法だけにして、Version Packages PR のコミットとタグを
                  # push する経路は v1 で動いていたものから動かさない。
                  push-with-git-cli: true
                  # GitHub トークンは github-token 入力の既定値（github.token）を使う。v2 は GITHUB_TOKEN
                  # 環境変数を設定として読まず、入力と食い違う値が env にあると失敗するので env では渡さない。

            # npm Trusted Publishing automatically creates provenance for public
            # packages. Verify signatures, then require a verified SLSA provenance
            # attestation for every exact name/version reported by Changesets.
            - name: Verify published package provenance
              if: steps.changesets.outputs.published == 'true'
              env:
                  PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
              run: node .github/scripts/verify-npm-provenance.mjs

            # changesets/action が publish を検出できないと、publish は成功したままタグの push・
            # GitHub Release の作成・上の provenance 検証が 3 つとも黙って飛び、run は成功で終わる
            # （RELEASE.md「changesets/action が publish を検出したことを検証する」）。
            # changeset publish は publish したパッケージのタグを HEAD に作るので、それが origin に
            # push されているかを突き合わせて、検出漏れを赤くする。段階は has-changesets で渡す。
            # provenance 検証より後に置くのは、検出はできてタグの push だけが失敗した run でも
            # provenance 検証を走らせるため。
            - name: Verify changesets/action pushed the release tags
              env:
                  HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
              run: node .github/scripts/verify-release-tags.mjs

            # version 段階と publish 段階の分岐が壊れると、Version Packages PR をマージしても
            # publish されないまま run は成功で終わり、npm だけが古いまま誰も気づけない。
            # main のバージョンが registry に出ているかを突き合わせて、その状態を赤くする。
            # publish 段階に入った run では registry を照会しない。changeset publish が成功した時点で
            # publish には到達しており、npm は publish を受け付けてから数分はバージョンを返さないため
            # （RELEASE.md「publish に到達したことを検証する」）。段階は has-changesets で渡す。
            - name: Verify npm reflects the versions on main
              env:
                  HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
              run: node .github/scripts/verify-release-published.mjs
