events {}

http {
  server {
    listen 3443 ssl;
    server_name op-tls;

    ssl_certificate /etc/nginx/certs/op-tls.crt;
    ssl_certificate_key /etc/nginx/certs/op-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://op:3010;
      proxy_connect_timeout 5s;
      proxy_http_version 1.1;
      # wrangler dev rewrites a Location whose host is the request's Host to its
      # own http:// origin, which sent the browser from /authorize to
      # http://op-tls:3443/login. The OP builds its URLs from the issuer, not
      # from Host, so the upstream gets its own host; X-Forwarded-Host keeps
      # the public one.
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 3443;
      proxy_set_header Connection "";
      proxy_redirect off;
    }
  }
}
