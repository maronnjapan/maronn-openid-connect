name: OpenID Conformance

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "OpenID Connect Core certification plan to run"
        required: false
        default: "basic"
        type: choice
        options:
          - basic
          - implicit
          - hybrid
      sample_app:
        description: "Sample OP app to test"
        required: false
        default: "hono-cloudflare"
        type: choice
        options:
          - hono-cloudflare
          - express-flyio
          - fastify-flyio
          - nextjs-vercel
      suite_image_tag:
        description: "OpenID conformance suite Docker image tag"
        required: false
        default: "latest"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/**"
      - "apps/**"
      - "samples/**"
      - "tests/conformance/**"
      - ".github/workflows/conformance.yml"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  op-plan:
    name: ${{ matrix.plan }}-op
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'run-conformance')
    runs-on: ubuntu-latest
    # The Hybrid OP plan runs 93 automated modules (three response types),
    # against 32 for the Basic OP plan and 48 for the Implicit OP plan.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A manual run checks the plan it chose; a labelled pull request
        # checks the Basic OP, the Implicit OP and the Hybrid OP plans.
        plan: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.plan) || '["basic","implicit","hybrid"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.plan }} OP conformance suite
        env:
          CONFORMANCE_SAMPLE_APP: ${{ github.event.inputs.sample_app || 'hono-cloudflare' }}
          CONFORMANCE_SUITE_IMAGE_TAG: ${{ github.event.inputs.suite_image_tag || 'latest' }}
          # The modules that wait for a screenshot never finish unattended, and
          # the runner waits 240 s for each (tests/conformance/README.md).
          CONFORMANCE_SKIP_MANUAL_REVIEW: "1"
        run: pnpm run conformance:${{ matrix.plan }}-op

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidf-${{ matrix.plan }}-op-conformance
          path: |
            tests/conformance/results
            tests/conformance/.generated
          if-no-files-found: ignore
