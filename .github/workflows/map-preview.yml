# OIDC Provider Map のプレビュー
#
# PR ごとに、その PR のコードから地図（apps/map。`maronn-oidc explain --format json` を
# 全機能オンで 4 フレームワーク分まとめたデータを読む React + Vite のページ）をビルドし、
# Actions の artifact（oidc-provider-map）として残す。
#
# Cloudflare のシークレット（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）があれば、
# PR では `wrangler versions upload` でその Worker（apps/map/wrangler.jsonc の name）の
# プレビュー URL を作って PR にコメントし、main への push では `wrangler deploy` で本番の
# URL を更新する。シークレットが無くても artifact は残るので、ダウンロードして dist/ を
# 静的に配信すれば同じ地図が見られる。
name: Map Preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: map-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CLI をビルドし（関数カタログをテンプレートに焼く）、その dist から地図のデータとページを作る。
      - name: Build the map
        run: pnpm run build:map

      - name: Upload the map
        uses: actions/upload-artifact@v7
        with:
          name: oidc-provider-map
          path: apps/map/dist
          if-no-files-found: error

      # PR: 本番を変えずにプレビュー URL だけ作る。main: 本番へデプロイする。
      - name: Deploy to Cloudflare Workers
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/map
          command: >-
            ${{ github.event_name == 'pull_request'
              && format('versions upload --message "PR #{0} {1}"', github.event.pull_request.number, github.event.pull_request.head.sha)
              || 'deploy' }}

      # fork からの PR は GITHUB_TOKEN が読み取り専用なのでコメントしない（artifact は残る）。
      - name: Comment the preview on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          DEPLOYED: ${{ steps.deploy.outcome }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- oidc-provider-map-preview -->';
            // `wrangler versions upload` prints "Version Preview URL: https://<id>-<worker>.<subdomain>.workers.dev".
            const fromOutput = /Version Preview URL:\s*(https:\/\/\S+)/.exec(process.env.COMMAND_OUTPUT || '');
            const url = (fromOutput && fromOutput[1]) || process.env.DEPLOYMENT_URL || '';
            const lines = [
              marker,
              '## OIDC Provider Map',
              '',
              url
                ? `Preview: ${url}`
                : process.env.DEPLOYED === 'skipped'
                  ? 'Preview: not deployed (no Cloudflare secrets). Download the `oidc-provider-map` artifact of the run below and serve `dist/` statically.'
                  : 'Preview: the upload ran but printed no preview URL; see the run below.',
              '',
              `Run: ${process.env.RUN_URL} (artifact \`oidc-provider-map\`)`,
              '',
              `Built from ${process.env.HEAD_SHA}. The map shows the endpoints, steps and functions of every framework with every feature on; the feature toggles narrow it to one \`maronn-oidc generate\` command line.`,
            ];
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
